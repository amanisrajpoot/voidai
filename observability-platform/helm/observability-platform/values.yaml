global:
  controlPlaneUrl: "https://control.example.com"

controlPlane:
  replicaCount: 2
  image:
    repository: observability-platform/control-plane
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: latest
  service:
    type: ClusterIP
    otlpGrpcPort: 4317
    otlpHttpPort: 4318
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi

opensearch:
  enabled: true
  replicas: 3
  persistence:
    enabled: true
    size: 100Gi
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

minio:
  enabled: true
  mode: distributed
  replicas: 4
  persistence:
    size: 100Gi
  accessKey: minioadmin
  secretKey: minioadmin

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: control.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: observability-platform-tls
      hosts:
        - control.example.com
