load_module modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 1024;
}

http {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/modsecurity.conf;
    modsecurity_rules_file /etc/nginx/modsec/coreruleset/crs-setup.conf;
    modsecurity_rules_file /etc/nginx/modsec/coreruleset/rules/*.conf;

    # Forward telemetry to OTEL collector
    upstream otel_collector {
        server otel-collector:4318;
    }

    server {
        listen 80;
        server_name _;

        # ModSecurity logging
        modsecurity_transaction_id "$request_id";
        modsecurity_audit_log /var/log/nginx/modsec_audit.log;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Send security events to OTEL collector
            access_log /var/log/nginx/access.log json;
        }

        # OTEL endpoint for WAF telemetry
        location /v1/traces {
            proxy_pass http://otel_collector;
        }
    }
}
