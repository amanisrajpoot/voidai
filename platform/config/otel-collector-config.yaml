receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert

exporters:
  logging:
    loglevel: debug
  otlp/opensearch:
    endpoint: http://opensearch:9200
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [logging, otlp/opensearch]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [logging, otlp/opensearch]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [logging, otlp/opensearch]
