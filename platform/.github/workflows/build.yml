name: Build and Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build-builder:
    name: Build Builder CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Build
        run: |
          cd platform/builder
          go build -o builder ./main.go
      
      - name: Test
        run: |
          cd platform/builder
          go test ./...

  build-frontend-sdk:
    name: Build Frontend SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd platform/agents/frontend
          npm ci
      
      - name: Build
        run: |
          cd platform/agents/frontend
          npm run build
      
      - name: Publish to npm
        if: github.event_name == 'release'
        run: |
          cd platform/agents/frontend
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-python-agent:
    name: Build Python Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Build wheel
        run: |
          cd platform/agents/backend/python
          pip install build
          python -m build
      
      - name: Publish to PyPI
        if: github.event_name == 'release'
        run: |
          cd platform/agents/backend/python
          pip install twine
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  package-linux:
    name: Package Linux (deb/rpm)
    runs-on: ubuntu-latest
    needs: [build-builder]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm
      
      - name: Build packages
        run: |
          cd platform/builder
          go build -o builder ./main.go
          ./builder package --target=deb,rpm --version=${{ github.ref_name }} --out=./dist
      
      - name: Sign packages
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          cd platform/builder/dist
          for pkg in *.deb *.rpm; do
            gpg --detach-sign --armor $pkg
          done
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: platform/builder/dist/*

  package-windows:
    name: Package Windows (msi)
    runs-on: windows-latest
    needs: [build-builder]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build MSI
        run: |
          cd platform/builder
          go build -o builder.exe ./main.go
          ./builder.exe package --target=msi --version=${{ github.ref_name }} --out=./dist
      
      - name: Sign MSI
        run: |
          # Sign with signtool (requires certificate)
          signtool sign /f certificate.pfx /p ${{ secrets.CERT_PASSWORD }} platform/builder/dist/*.msi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: platform/builder/dist/*

  package-macos:
    name: Package macOS (dmg)
    runs-on: macos-latest
    needs: [build-builder]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build DMG
        run: |
          cd platform/builder
          go build -o builder ./main.go
          ./builder package --target=dmg --version=${{ github.ref_name }} --out=./dist
      
      - name: Sign and notarize
        run: |
          codesign --sign "Developer ID Application: Your Name" platform/builder/dist/*.dmg
          xcrun notarytool submit platform/builder/dist/*.dmg --keychain-profile "notarytool" --wait
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: platform/builder/dist/*
