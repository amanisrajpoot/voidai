# NGINX + ModSecurity Configuration for Security Platform WAF

server {
    listen 80;
    server_name _;

    # ModSecurity configuration
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # Security Platform integration
    location / {
        # Forward requests to backend
        proxy_pass http://backend;
        
        # Add Security Platform headers
        proxy_set_header X-Security-Platform-Agent "nginx-waf";
        proxy_set_header X-Request-ID $request_id;
        
        # Log to Security Platform
        access_log /var/log/nginx/security-platform.log security_platform_format;
    }

    # OTLP endpoint for telemetry
    location /v1/traces {
        proxy_pass http://security-platform-collector:4318;
    }
}

# Custom log format for Security Platform
log_format security_platform_format '{"timestamp":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$request_uri","status":"$status","remote_addr":"$remote_addr","user_agent":"$http_user_agent","response_time":"$request_time"}';

# ModSecurity rules
# Include OWASP CRS
include /etc/nginx/modsec/owasp-crs/crs-setup.conf;
include /etc/nginx/modsec/owasp-crs/rules/*.conf;

# Security Platform custom rules
SecRuleEngine On
SecRule REQUEST_HEADERS:User-Agent "@contains bot" \
    "id:1001,\
    phase:1,\
    log,\
    msg:'Bot detected',\
    pass,\
    t:none,\
    setvar:'tx.security_platform_event=bot_detected'"

# Forward events to Security Platform
SecAction \
    "id:9001,\
    phase:1,\
    nolog,\
    pass,\
    exec:/usr/local/bin/security-platform-waf-forwarder"
