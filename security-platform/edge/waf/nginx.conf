user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

load_module modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format security_platform '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                '"$http_x_forwarded_for" '
                                'trace_id=$http_x_trace_id '
                                'request_id=$http_x_request_id';

    access_log /var/log/nginx/access.log security_platform;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ModSecurity configuration
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/modsecurity.conf;

    # Include OWASP CRS rules
    include /etc/nginx/modsec/coreruleset/crs-setup.conf;
    include /etc/nginx/modsec/coreruleset/rules/*.conf;

    # Lua initialization
    init_by_lua_block {
        local http = require "resty.http"
        -- Initialize security platform WAF plugin
    }

    server {
        listen 80;
        server_name _;

        # Security Platform WAF integration
        access_by_lua_file /etc/nginx/lua/waf-plugin.lua;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trace-ID $http_x_trace_id;
            proxy_set_header X-Request-ID $http_x_request_id;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
