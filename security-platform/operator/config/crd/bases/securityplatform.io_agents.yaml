apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.securityplatform.io
spec:
  group: securityplatform.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              controlPlaneURL:
                type: string
              authKey:
                type: string
              authKeySecretRef:
                type: object
                properties:
                  name:
                    type: string
                  key:
                    type: string
              serviceName:
                type: string
              environment:
                type: string
              otlpEndpoint:
                type: string
              replicas:
                type: integer
              image:
                type: string
              resources:
                type: object
          status:
            type: object
            properties:
              replicas:
                type: integer
              readyReplicas:
                type: integer
  scope: Namespaced
  names:
    plural: agents
    singular: agent
    kind: Agent
