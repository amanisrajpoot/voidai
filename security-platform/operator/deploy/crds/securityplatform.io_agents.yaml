apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.securityplatform.io
spec:
  group: securityplatform.io
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              controlPlaneUrl:
                type: string
                description: Control plane URL
              authKey:
                type: string
                description: Authentication key (can use Secret reference)
              serviceName:
                type: string
                description: Service name for telemetry
              environment:
                type: string
                description: Environment (production, staging, development)
              namespace:
                type: string
                description: Kubernetes namespace
              telemetry:
                type: object
                properties:
                  batchSize:
                    type: integer
                  batchTimeout:
                    type: string
                  exportTimeout:
                    type: string
                  maxQueueSize:
                    type: integer
              policy:
                type: object
                properties:
                  mode:
                    type: string
                    enum: ["observe", "block"]
                  autoEnableBlocking:
                    type: boolean
              resources:
                type: object
                description: Resource limits for the agent
          status:
            type: object
            properties:
              phase:
                type: string
                enum: ["Pending", "Running", "Failed"]
              message:
                type: string
              lastUpdateTime:
                type: string
                format: date-time
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: agents
    singular: agent
    kind: Agent
    shortNames:
    - spagent
