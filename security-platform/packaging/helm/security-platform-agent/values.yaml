replicaCount: 1

image:
  repository: securityplatform/agent
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 4318

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: agent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

config:
  controlPlaneUrl: ""
  authKey: ""
  serviceName: "agent"
  environment: "production"
  otlpEndpoint: "http://localhost:4318"
  telemetry:
    batchSize: 100
    batchTimeout: "5s"
    maxQueueSize: 2048
  policy:
    mode: "observe"
  redaction:
    enabled: true

volumes: []
volumeMounts: []
