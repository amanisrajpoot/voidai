apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.securityplatform.io
spec:
  group: securityplatform.io
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              controlPlaneUrl:
                type: string
              authKeySecretRef:
                type: object
                properties:
                  name:
                    type: string
                  key:
                    type: string
                  namespace:
                    type: string
              serviceName:
                type: string
              environment:
                type: string
              namespace:
                type: string
              otlpEndpoint:
                type: string
              replicas:
                type: integer
              image:
                type: string
              imagePullPolicy:
                type: string
          status:
            type: object
            properties:
              replicas:
                type: integer
              readyReplicas:
                type: integer
              conditions:
                type: array
                items:
                  type: object
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: agents
    singular: agent
    kind: Agent
    shortNames:
    - spagent
