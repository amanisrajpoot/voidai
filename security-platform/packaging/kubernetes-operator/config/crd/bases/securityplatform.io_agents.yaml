apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.securityplatform.io
spec:
  group: securityplatform.io
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              controlPlaneUrl:
                type: string
              authKey:
                type: string
              serviceName:
                type: string
              environment:
                type: string
                default: production
              otlpEndpoint:
                type: string
              localPolicy:
                type: string
                enum: ["observe", "block"]
                default: observe
          status:
            type: object
            properties:
              phase:
                type: string
              message:
                type: string
              lastUpdated:
                type: string
                format: date-time
  scope: Namespaced
  names:
    plural: agents
    singular: agent
    kind: Agent
    shortNames:
    - spagent
