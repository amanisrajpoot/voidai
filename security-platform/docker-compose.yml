version: '3.8'

services:
  # Control Plane API
  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OPENSEARCH_ENDPOINT=http://opensearch:9200
    depends_on:
      - opensearch
    networks:
      - security-platform

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./telemetry/collector/otel-collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - OPENSEARCH_ENDPOINT=http://opensearch:9200
      - S3_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=security-platform-sessions
    depends_on:
      - opensearch
      - minio
    networks:
      - security-platform

  # OpenSearch (telemetry storage)
  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=admin123"
      - "DISABLE_SECURITY_PLUGIN=true"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - security-platform

  # MinIO (session blob storage)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - security-platform

  # Orchestrator (SOAR-lite)
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - CONTROL_PLANE_URL=http://control-plane:8080
    depends_on:
      - control-plane
    networks:
      - security-platform

  # WAF (Nginx + ModSecurity)
  waf:
    build:
      context: ./edge/waf
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SECURITY_PLATFORM_CONTROL_PLANE_URL=http://control-plane:8080
      - SECURITY_PLATFORM_AUTH_KEY=dev-key
    depends_on:
      - control-plane
    networks:
      - security-platform

volumes:
  opensearch-data:
  minio-data:

networks:
  security-platform:
    driver: bridge
