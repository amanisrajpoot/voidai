version: '3.8'

services:
  # Control Plane API
  control-plane:
    build:
      context: ./control-plane/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/securityplatform
      - OPENSEARCH_ENDPOINT=http://opensearch:9200
    depends_on:
      - postgres
      - opensearch
    networks:
      - security-platform

  # OpenTelemetry Collector
  collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./telemetry/collector/otel-collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    environment:
      - OPENSEARCH_ENDPOINT=http://opensearch:9200
      - CLICKHOUSE_ENDPOINT=tcp://clickhouse:9000
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=security-platform-sessions
    depends_on:
      - opensearch
      - clickhouse
      - minio
    networks:
      - security-platform

  # OpenSearch for traces and logs
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - security-platform

  # ClickHouse for metrics
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - security-platform

  # MinIO for session storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - security-platform

  # PostgreSQL for control plane metadata
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=securityplatform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - security-platform

  # Orchestrator
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - CONTROL_PLANE_URL=http://control-plane:8080
    depends_on:
      - control-plane
    networks:
      - security-platform

  # Dashboard (optional, placeholder)
  dashboard:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./control-plane/dashboard/dist:/usr/share/nginx/html
    networks:
      - security-platform

volumes:
  opensearch-data:
  clickhouse-data:
  minio-data:
  postgres-data:

networks:
  security-platform:
    driver: bridge
